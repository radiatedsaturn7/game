<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=./fnaf/index.html" />
    <title>Factory FNAF Prototype</title>
    <script>
      const target = `./fnaf/index.html${window.location.search}${window.location.hash}`;
      window.location.replace(target);
    </script>
  </head>
  <body>
    <main>
      <p>
        Redirecting to the Factory FNAF prototype.
        If you are not redirected, <a id="gameLink" href="./fnaf/index.html">open the game</a>.
      </p>
    </main>
    <script>
      const link = document.getElementById("gameLink");
      if (link) {
        link.href = `./fnaf/index.html${window.location.search}${window.location.hash}`;
      }
    </script>
  </body>
</html>
